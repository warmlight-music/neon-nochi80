<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neon Nights 80s V2.0</title>
<style>
  :root{
    --bg:#0a0014; 
    --bg2:#1a0033;
    --card:#1f0038;
    --accent:#ff00cc; 
    --accent2:#9d00ff; 
    --text:#f8e8ff;
    --muted:#b88cc9;
    --glow:rgba(255,0,204,.4);
  }
  
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  *{box-sizing:border-box;margin:0;padding:0}
  
  body{
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: radial-gradient(circle at 50% 0%,var(--bg2) 0%,var(--bg) 65%);
    color:var(--text); min-height:100vh; display:flex; flex-direction:column;
    align-items:center; padding:24px 16px 48px; gap:24px;
    width: 100%; max-width: 100vw; overflow-x: hidden;
    -webkit-user-select: none; user-select: none; line-height: 1.5;
  }

  .lang { 
    align-self: flex-end; 
    display:flex; 
    gap:6px; 
    background:var(--card); 
    padding:4px; 
    border-radius:8px; 
    border:1px solid rgba(255,0,204,.3); 
  }
  .lang button { background:transparent; border:none; color:var(--muted); padding:6px 16px; border-radius:4px; font-weight:800; font-size:13px; cursor:pointer; transition:all .3s ease; }
  .lang button.active { background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#fff; box-shadow:0 4px 14px var(--glow); }

  .album { text-align:center; display:flex; flex-direction:column; align-items:center; gap:16px; width:100%; max-width:600px; }
  .album__cover { width:min(280px,72vw); aspect-ratio:1/1; border-radius:8px; object-fit:cover; box-shadow:0 20px 50px var(--glow); border:2px solid var(--accent); pointer-events: none; }
  .album__title { font-size:clamp(24px,5vw,40px); font-weight:900; letter-spacing:-.02em; color: #fff; text-transform: uppercase; line-height: 1.1; text-shadow: 0 0 20px var(--glow); }
  .album__sub { color:var(--accent); font-size:14px; font-weight: 600; letter-spacing: 3px; text-transform: uppercase; }

  .carousel { width:100%; max-width:960px; display:flex; gap:20px; overflow-x:auto; padding:10px 8px 20px; scroll-snap-type:x mandatory; scrollbar-width:thin; scrollbar-color:var(--accent) transparent; }
  .carousel::-webkit-scrollbar { height:6px; }
  .carousel::-webkit-scrollbar-thumb { background:var(--accent); border-radius:4px; }
  
  .track { flex:0 0 auto; width:200px; scroll-snap-align:center; background:var(--card); border-radius:8px; padding:10px; cursor:pointer; transition:transform .2s, box-shadow .2s; border:2px solid transparent; text-align:left; display: flex; flex-direction: column;}
  .track:hover { transform:translateY(-5px); box-shadow: 0 10px 25px var(--glow); border-color: rgba(255,0,204,.3); }
  .track.active { border:2px solid var(--accent); box-shadow:0 0 15px var(--glow); }
  
  .track__cover { width:100%; aspect-ratio:1/1; border-radius:4px; object-fit:cover; display:block; margin-bottom:12px; background:var(--bg2); pointer-events: none; flex-shrink: 0;}
  
  .track__num { font-size:11px; color:var(--accent); font-weight:800; letter-spacing:.1em; margin-bottom:6px; }
  .track__name { font-size:15px; font-weight:800; margin-bottom:2px; line-height: 1.2; color: #fff; }
  .track__artist { font-size:12px; color:var(--accent); font-weight:600; margin-bottom:4px; text-transform: uppercase; letter-spacing: 1px;}
  .track__desc { font-size:12px; color:var(--muted); line-height: 1.4; flex-grow: 1; font-style: italic; }

  .player { width:100%; max-width:600px; background:var(--card); border-radius:12px; padding:20px; display:flex; flex-direction:column; gap:16px; box-shadow:0 15px 50px rgba(0,0,0,.8); border:1px solid rgba(255,0,204,.2); position: sticky; bottom: 10px; z-index: 10;}
  .player__now { display:flex; align-items:center; gap:16px; }
  .player__cover { width:70px; height:70px; border-radius:8px; object-fit:cover; background:var(--bg2); border:1px solid var(--accent); pointer-events: none; }
  .player__info { overflow:hidden; flex:1; }
  .player__title { font-weight:800; font-size:16px; line-height:1.25; margin-bottom:2px; color: #fff;}
  .player__artist { color:var(--accent); font-size:13px; font-weight:600; text-transform: uppercase; letter-spacing: 1px;}
  .player audio { width:100%; outline: none; }
  
  .player__nav { display:flex; justify-content:center; gap:16px; }
  .player__nav button { background:linear-gradient(135deg,var(--accent),var(--accent2)); border:none; color:#fff; padding:12px 24px; border-radius:8px; font-weight:900; font-size:14px; cursor:pointer; transition:filter 0.3s; text-transform: uppercase; letter-spacing: 1px; box-shadow: 0 4px 15px var(--glow);}
  .player__nav button:hover { filter:brightness(1.2); }
</style>
</head>
<body>

  <div class="lang" role="group" aria-label="Language">
    <button id="btnRu">RU</button>
    <button id="btnEn" class="active">EN</button>
  </div>

  <section class="album">
    <img class="album__cover" id="albumCover" src="cover.jpg" alt="Album Cover">
    <h1 class="album__title" id="albumTitle">Neon Nights 80s V2.0</h1>
    <p class="album__sub" id="albumSub">Неоновые ночи 80-х V2.0</p>
  </section>

  <div class="carousel" id="carousel"></div>

  <div class="player">
    <div class="player__now">
      <img class="player__cover" id="playerCover" src="cover.jpg" alt="Cover">
      <div class="player__info">
        <div class="player__title" id="playerTitle">Pick a track</div>
        <div class="player__artist" id="playerArtist">Neon 80s</div>
      </div>
    </div>
    <audio id="audio" controls controlslist="nodownload" preload="none"></audio>
    <div class="player__nav">
      <button id="prevBtn">⏮ Prev</button>
      <button id="nextBtn">Next ⏭</button>
    </div>
  </div>

<script>
  const album = {
    titleEn: "Neon Nights 80s V2.0",
    titleRu: "Неоновые ночи 80-х V2.0",
    cover: "cover.jpg",
    tracks: [
      { id: 1, artist: "Ottawan", en: "Hands to the Sky", ru: "Руки вверх на танцполе!" },
      { id: 2, artist: "Boney M.", en: "Caribbean Midnight Train", ru: "Огни ночного карнавала" },
      { id: 3, artist: "Baccara", en: "No Apology Tonight", ru: "Прости, я просто леди" },
      { id: 4, artist: "ABBA", en: "Shine on Me Tonight", ru: "Сияй в ночи со мной" },
      { id: 5, artist: "C.C. Catch", en: "Fire and Ice in the Disco Light", ru: "Незнакомцы в ночи" },
      { id: 6, artist: "Modern Talking", en: "Cheri, Cheri Lady of the Night", ru: "Ты моя королева ночи" },
      { id: 7, artist: "Bad Boys Blue", en: "Queen of My Lonely Heart", ru: "Ты — женщина моей мечты" },
      { id: 8, artist: "Fancy", en: "Sparks of Midnight Love", ru: "Пламя ночной любви" },
      { id: 9, artist: "Sandra", en: "Whispers in the Heat of the Night", ru: "Тайна ночного миража" },
      { id: 10, artist: "Secret Service", en: "Sparks in the Midnight Mist", ru: "Вспышка в ночной тишине" },
      { id: 11, artist: "Savage", en: "Shadows of Goodbye", ru: "Тени прощания" },
      { id: 12, artist: "Alphaville", en: "Starlight Memories", ru: "Мы останемся молодыми" }
    ]
  };

  let lang = 'en';
  let currentTrack = -1;

  const carousel    = document.getElementById('carousel');
  const audio       = document.getElementById('audio');
  const playerCover = document.getElementById('playerCover');
  const playerTitle = document.getElementById('playerTitle');
  const playerArtist= document.getElementById('playerArtist');
  const albumTitle  = document.getElementById('albumTitle');
  const albumSub    = document.getElementById('albumSub');
  const btnRu       = document.getElementById('btnRu');
  const btnEn       = document.getElementById('btnEn');

  const pad = (n) => String(n).padStart(2,'0');
  
  const coverPath = (id) => `covers/${pad(id)}.jpg`;
  const songPath  = (id) => `${lang}${pad(id)}.mp3`;
  
  const trackName = (t) => lang === 'ru' ? t.ru : t.en;

  function renderCarousel(){
    carousel.innerHTML = '';
    album.tracks.forEach((t, i) => {
      const el = document.createElement('div');
      el.className = 'track' + (i === currentTrack ? ' active' : '');
      el.dataset.index = i;
      el.innerHTML = `
        <img class="track__cover" src="${coverPath(t.id)}" alt="${trackName(t)}">
        <div class="track__num">TRACK #${t.id}</div>
        <div class="track__name">${trackName(t)}</div>
        <div class="track__artist">${t.artist}</div>
      `;
      el.addEventListener('click', () => play(i));
      carousel.appendChild(el);
    });
  }

  function updateAlbumHeader() {
    albumTitle.textContent = lang === 'ru' ? album.titleRu : album.titleEn;
    albumSub.textContent = lang === 'ru' ? album.titleEn : album.titleRu;
  }

  function play(i){
    if (i < 0) i = album.tracks.length - 1;
    if (i >= album.tracks.length) i = 0;

    currentTrack = i;
    const t = album.tracks[i];

    playerCover.src = coverPath(t.id);
    playerTitle.textContent = trackName(t);
    playerArtist.textContent = t.artist;

    [...carousel.querySelectorAll('.track')].forEach((el, idx) => el.classList.toggle('active', idx === i));
    carousel.children[i]?.scrollIntoView({behavior:'smooth', inline:'center', block:'nearest'});

    audio.src = songPath(t.id);
    audio.play().catch(()=>{});
  }

  function setLang(newLang){
    if (lang === newLang) return;
    
    const wasPlaying = !audio.paused;
    const time = audio.currentTime;

    lang = newLang;

    btnRu.classList.toggle('active', lang === 'ru');
    btnEn.classList.toggle('active', lang === 'en');
    document.documentElement.lang = lang;

    updateAlbumHeader(); 
    renderCarousel();
    
    document.getElementById('prevBtn').textContent = lang === 'en' ? '⏮ Prev' : '⏮ Пред';
    document.getElementById('nextBtn').textContent = lang === 'en' ? 'Next ⏭' : 'След ⏭';

    if (currentTrack >= 0){
      const t = album.tracks[currentTrack];
      
      playerCover.src = coverPath(t.id);
      playerTitle.textContent = trackName(t);
      playerArtist.textContent = t.artist;
      
      audio.src = songPath(t.id);
      audio.currentTime = time; 
      
      if (wasPlaying) {
        audio.play().catch(()=>{}); 
      }
    } else {
      playerTitle.textContent = lang === 'en' ? 'Pick a track' : 'Выбери трек';
      playerArtist.textContent = "Neon 80s";
    }
  }

  btnRu.addEventListener('click', () => setLang('ru'));
  btnEn.addEventListener('click', () => setLang('en'));

  document.getElementById('prevBtn').onclick = () => play(currentTrack - 1);
  document.getElementById('nextBtn').onclick = () => play(currentTrack + 1);
  audio.addEventListener('ended', () => play(currentTrack + 1));

  document.addEventListener('contextmenu', e => e.preventDefault());
  document.addEventListener('dragstart', e => e.preventDefault());

  updateAlbumHeader();
  renderCarousel();
</script>
</body>
</html>
